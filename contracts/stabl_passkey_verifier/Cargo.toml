[package]
name = "stabl-passkey-verifier"
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/STABL-Africa/stabl_contracts"
publish = false

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
hex-literal = { workspace = true }