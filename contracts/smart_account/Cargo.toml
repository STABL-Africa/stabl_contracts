[package]
name = "smart_account"
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/STABL-Africa/stabl_contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
